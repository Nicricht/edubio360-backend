{
  "version": "3.8",
  "services": {
    "mysql": {
      "image": "mysql:8.0",
      "environment": {
        "MYSQL_ROOT_PASSWORD": "${MYSQL_ROOT_PASSWORD}"
      },
      "volumes": [
        "mysql_data:/var/lib/mysql"
      ],
      "configs": [
        {
          "source": "mysql_init",
          "target": "/docker-entrypoint-initdb.d/01-create-databases.sql"
        }
      ],
      "networks": [
        "backend"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 --silent"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "90s"
      },
      "deploy": {
        "replicas": 1,
        "placement": {
          "constraints": [
            "node.role == manager"
          ]
        },
        "restart_policy": {
          "condition": "any"
        },
        "resources": {
          "limits": {
            "memory": "1G"
          }
        }
      }
    },
    "rabbitmq": {
      "image": "rabbitmq:3.13-management",
      "user": "0:0",
      "entrypoint": [
        "/bin/sh",
        "-ec",
        "if [ -e /var/lib/rabbitmq/.erlang.cookie ]; then chown rabbitmq:rabbitmq /var/lib/rabbitmq/.erlang.cookie; chmod 400 /var/lib/rabbitmq/.erlang.cookie; fi; exec /usr/local/bin/docker-entrypoint.sh rabbitmq-server",
        "--"
      ],
      "command": [
        "rabbitmq-server"
      ],
      "environment": {
        "RABBITMQ_DEFAULT_USER": "edubio",
        "RABBITMQ_DEFAULT_PASS": "${RABBITMQ_PASSWORD}"
      },
      "volumes": [
        "rabbit_data:/var/lib/rabbitmq"
      ],
      "hostname": "rabbitmq",
      "networks": [
        "backend"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "check_running"
        ],
        "interval": "15s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "90s"
      },
      "deploy": {
        "replicas": 1,
        "placement": {
          "constraints": [
            "node.role == manager"
          ]
        },
        "restart_policy": {
          "condition": "any"
        },
        "resources": {
          "limits": {
            "memory": "512M"
          }
        }
      }
    },
    "discovery-server": {
      "image": "${IMAGE_PREFIX}/discovery-server:${IMAGE_TAG}",
      "environment": {
        "JAVA_TOOL_OPTIONS": "-XX:MaxRAMPercentage=65 -Djavax.xml.accessExternalDTD= -Djavax.xml.accessExternalSchema= -Djavax.xml.accessExternalStylesheet=",
        "EUREKA_SERVER_EVICTION_INTERVAL_TIMER_IN_MS": "5000"
      },
      "networks": [
        "backend"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8761/actuator/health >/dev/null"
        ],
        "interval": "20s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "180s"
      },
      "deploy": {
        "replicas": 1,
        "restart_policy": {
          "condition": "any",
          "delay": "10s"
        },
        "update_config": {
          "parallelism": 1,
          "order": "stop-first",
          "failure_action": "rollback"
        },
        "resources": {
          "limits": {
            "memory": "1G"
          },
          "reservations": {
            "memory": "256M"
          }
        },
        "placement": {
          "constraints": [
            "node.role == manager"
          ]
        }
      }
    },
    "auth-service": {
      "image": "${IMAGE_PREFIX}/auth-service:${IMAGE_TAG}",
      "environment": {
        "JAVA_TOOL_OPTIONS": "-XX:MaxRAMPercentage=65 -Djavax.xml.accessExternalDTD= -Djavax.xml.accessExternalSchema= -Djavax.xml.accessExternalStylesheet=",
        "EUREKA_URL": "http://discovery-server:8761/eureka/",
        "EUREKA_INSTANCE_PREFER_IP_ADDRESS": "true",
        "SPRING_PROFILES_ACTIVE": "mysql",
        "DB_HOST": "mysql",
        "DB_PORT": "3306",
        "DB_NAME": "authdb",
        "DB_USER": "root",
        "DB_PASSWORD": "${MYSQL_ROOT_PASSWORD}",
        "JWT_SECRET": "${JWT_SECRET}"
      },
      "networks": [
        "backend"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8081/actuator/health >/dev/null"
        ],
        "interval": "20s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "180s"
      },
      "deploy": {
        "replicas": 1,
        "restart_policy": {
          "condition": "any",
          "delay": "10s"
        },
        "update_config": {
          "parallelism": 1,
          "order": "stop-first",
          "failure_action": "rollback"
        },
        "resources": {
          "limits": {
            "memory": "1G"
          },
          "reservations": {
            "memory": "256M"
          }
        }
      }
    },
    "academic-service": {
      "image": "${IMAGE_PREFIX}/academic-service:${IMAGE_TAG}",
      "environment": {
        "JAVA_TOOL_OPTIONS": "-XX:MaxRAMPercentage=65 -Djavax.xml.accessExternalDTD= -Djavax.xml.accessExternalSchema= -Djavax.xml.accessExternalStylesheet=",
        "EUREKA_URL": "http://discovery-server:8761/eureka/",
        "EUREKA_INSTANCE_PREFER_IP_ADDRESS": "true",
        "SPRING_PROFILES_ACTIVE": "mysql",
        "DB_HOST": "mysql",
        "DB_PORT": "3306",
        "DB_NAME": "academicdb",
        "DB_USER": "root",
        "DB_PASSWORD": "${MYSQL_ROOT_PASSWORD}",
        "SERVER_SHUTDOWN": "graceful",
        "SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE": "20s",
        "EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS": "5",
        "EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS": "20"
      },
      "networks": [
        "backend"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8082/actuator/health >/dev/null"
        ],
        "interval": "20s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "180s"
      },
      "deploy": {
        "replicas": 1,
        "restart_policy": {
          "condition": "any",
          "delay": "10s"
        },
        "update_config": {
          "parallelism": 1,
          "order": "stop-first",
          "failure_action": "rollback"
        },
        "resources": {
          "limits": {
            "memory": "1G"
          },
          "reservations": {
            "memory": "256M"
          }
        }
      },
      "stop_grace_period": "45s"
    },
    "guidance-service": {
      "image": "${IMAGE_PREFIX}/guidance-service:${IMAGE_TAG}",
      "environment": {
        "JAVA_TOOL_OPTIONS": "-XX:MaxRAMPercentage=65 -Djavax.xml.accessExternalDTD= -Djavax.xml.accessExternalSchema= -Djavax.xml.accessExternalStylesheet=",
        "EUREKA_URL": "http://discovery-server:8761/eureka/",
        "EUREKA_INSTANCE_PREFER_IP_ADDRESS": "true",
        "SPRING_PROFILES_ACTIVE": "mysql",
        "DB_HOST": "mysql",
        "DB_PORT": "3306",
        "DB_NAME": "guidancedb",
        "DB_USER": "root",
        "DB_PASSWORD": "${MYSQL_ROOT_PASSWORD}",
        "RABBITMQ_HOST": "rabbitmq",
        "RABBITMQ_USER": "edubio",
        "RABBITMQ_PASSWORD": "${RABBITMQ_PASSWORD}"
      },
      "networks": [
        "backend"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8083/actuator/health >/dev/null"
        ],
        "interval": "20s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "180s"
      },
      "deploy": {
        "replicas": 1,
        "restart_policy": {
          "condition": "any",
          "delay": "10s"
        },
        "update_config": {
          "parallelism": 1,
          "order": "stop-first",
          "failure_action": "rollback"
        },
        "resources": {
          "limits": {
            "memory": "1G"
          },
          "reservations": {
            "memory": "256M"
          }
        }
      }
    },
    "notification-service": {
      "image": "${IMAGE_PREFIX}/notification-service:${IMAGE_TAG}",
      "environment": {
        "JAVA_TOOL_OPTIONS": "-XX:MaxRAMPercentage=65 -Djavax.xml.accessExternalDTD= -Djavax.xml.accessExternalSchema= -Djavax.xml.accessExternalStylesheet=",
        "EUREKA_URL": "http://discovery-server:8761/eureka/",
        "EUREKA_INSTANCE_PREFER_IP_ADDRESS": "true",
        "SPRING_PROFILES_ACTIVE": "mysql",
        "DB_HOST": "mysql",
        "DB_PORT": "3306",
        "DB_NAME": "notificationdb",
        "DB_USER": "root",
        "DB_PASSWORD": "${MYSQL_ROOT_PASSWORD}",
        "RABBITMQ_HOST": "rabbitmq",
        "RABBITMQ_USER": "edubio",
        "RABBITMQ_PASSWORD": "${RABBITMQ_PASSWORD}"
      },
      "networks": [
        "backend"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8084/actuator/health >/dev/null"
        ],
        "interval": "20s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "180s"
      },
      "deploy": {
        "replicas": 1,
        "restart_policy": {
          "condition": "any",
          "delay": "10s"
        },
        "update_config": {
          "parallelism": 1,
          "order": "stop-first",
          "failure_action": "rollback"
        },
        "resources": {
          "limits": {
            "memory": "1G"
          },
          "reservations": {
            "memory": "256M"
          }
        }
      }
    },
    "analytics-service": {
      "image": "${IMAGE_PREFIX}/analytics-service:${IMAGE_TAG}",
      "environment": {
        "JAVA_TOOL_OPTIONS": "-XX:MaxRAMPercentage=65 -Djavax.xml.accessExternalDTD= -Djavax.xml.accessExternalSchema= -Djavax.xml.accessExternalStylesheet=",
        "EUREKA_URL": "http://discovery-server:8761/eureka/",
        "EUREKA_INSTANCE_PREFER_IP_ADDRESS": "true",
        "SPRING_PROFILES_ACTIVE": "mysql",
        "DB_HOST": "mysql",
        "DB_PORT": "3306",
        "DB_NAME": "analyticsdb",
        "DB_USER": "root",
        "DB_PASSWORD": "${MYSQL_ROOT_PASSWORD}",
        "SERVER_SHUTDOWN": "graceful",
        "SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE": "20s",
        "EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS": "5",
        "EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS": "20"
      },
      "networks": [
        "backend"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8085/actuator/health >/dev/null"
        ],
        "interval": "20s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "180s"
      },
      "deploy": {
        "replicas": 1,
        "restart_policy": {
          "condition": "any",
          "delay": "10s"
        },
        "update_config": {
          "parallelism": 1,
          "order": "stop-first",
          "failure_action": "rollback"
        },
        "resources": {
          "limits": {
            "memory": "1G"
          },
          "reservations": {
            "memory": "256M"
          }
        }
      },
      "stop_grace_period": "45s"
    },
    "import-service": {
      "image": "${IMAGE_PREFIX}/import-service:${IMAGE_TAG}",
      "environment": {
        "JAVA_TOOL_OPTIONS": "-XX:MaxRAMPercentage=65 -Djavax.xml.accessExternalDTD= -Djavax.xml.accessExternalSchema= -Djavax.xml.accessExternalStylesheet=",
        "EUREKA_URL": "http://discovery-server:8761/eureka/",
        "EUREKA_INSTANCE_PREFER_IP_ADDRESS": "true",
        "SPRING_PROFILES_ACTIVE": "mysql",
        "DB_HOST": "mysql",
        "DB_PORT": "3306",
        "DB_NAME": "importdb",
        "DB_USER": "root",
        "DB_PASSWORD": "${MYSQL_ROOT_PASSWORD}"
      },
      "networks": [
        "backend"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8086/actuator/health >/dev/null"
        ],
        "interval": "20s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "180s"
      },
      "deploy": {
        "replicas": 1,
        "restart_policy": {
          "condition": "any",
          "delay": "10s"
        },
        "update_config": {
          "parallelism": 1,
          "order": "stop-first",
          "failure_action": "rollback"
        },
        "resources": {
          "limits": {
            "memory": "1G"
          },
          "reservations": {
            "memory": "256M"
          }
        }
      }
    },
    "api-gateway": {
      "image": "${IMAGE_PREFIX}/api-gateway:${IMAGE_TAG}",
      "environment": {
        "JAVA_TOOL_OPTIONS": "-XX:MaxRAMPercentage=65 -Djavax.xml.accessExternalDTD= -Djavax.xml.accessExternalSchema= -Djavax.xml.accessExternalStylesheet=",
        "EUREKA_URL": "http://discovery-server:8761/eureka/",
        "EUREKA_INSTANCE_PREFER_IP_ADDRESS": "true",
        "JWT_SECRET": "${JWT_SECRET}",
        "EP3_STRICT_ACCESS": "true",
        "SPRING_CLOUD_LOADBALANCER_CACHE_TTL": "5s"
      },
      "networks": [
        "backend"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null"
        ],
        "interval": "20s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "180s"
      },
      "deploy": {
        "restart_policy": {
          "condition": "any",
          "delay": "10s"
        },
        "update_config": {
          "parallelism": 1,
          "order": "stop-first",
          "failure_action": "rollback"
        },
        "resources": {
          "limits": {
            "memory": "1G"
          },
          "reservations": {
            "memory": "256M"
          }
        },
        "mode": "global"
      },
      "ports": [
        {
          "target": 8080,
          "published": 8080,
          "protocol": "tcp",
          "mode": "host"
        }
      ]
    }
  },
  "networks": {
    "backend": {
      "driver": "overlay",
      "attachable": true
    }
  },
  "volumes": {
    "mysql_data": {},
    "rabbit_data": {}
  },
  "configs": {
    "mysql_init": {
      "file": "./mysql/init/01-create-databases.sql"
    }
  }
}
