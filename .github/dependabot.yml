version: 2
updates:
  - package-ecosystem: maven
    directories:
      - /
      - /discovery-server
      - /api-gateway
      - /auth-service
      - /academic-service
      - /guidance-service
      - /notification-service
      - /analytics-service
      - /import-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
