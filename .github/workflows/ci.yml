name: EP02 Verify Java 21

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Maven clean verify
        run: mvn -B clean verify

      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Mostrar artefactos JAR
        run: find . -path "*/target/*.jar" -type f -print

      - name: Guardar reportes y JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep02-evidencias
          if-no-files-found: warn
          path: |
            **/target/*.jar
            **/target/site/jacoco/**
            **/target/cucumber/**
            **/target/surefire-reports/**

  mysql-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test full Docker stack, MySQL credentials and Gateway JWT
        env:
          MYSQL_ROOT_PASSWORD: ci-nondefault-mysql-root-2026
        run: bash scripts/smoke-mysql.sh

      - name: Guardar logs Docker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep02-mysql-smoke
          if-no-files-found: warn
          path: artifacts/**
