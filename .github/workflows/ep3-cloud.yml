name: EduBio360 EP3 JVY0101
on:
  push:
    branches: [ep3-devops-cloud]
  pull_request:
    branches: [ep3-devops-cloud]
  workflow_dispatch:
    inputs:
      deploy_isolated_aws:
        description: "Autorizar aprovisionamiento AWS independiente (consume créditos)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ep3-v2-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  scope:
    name: Clasificar cambios
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determinar alcance
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/ci-scope.py >> "$GITHUB_OUTPUT"
  verify:
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pruebas Maven
        run: mvn -B -ntp clean verify
      - name: Diagnóstico JaCoCo
        if: always()
        run: python3 -B scripts/ep3/coverage-diagnostics.py
      - name: Exportar métricas reales de cobertura
        run: mkdir -p artifacts && python3 scripts/ep3/ci-metrics.py > artifacts/ci-metrics.prom
      - uses: actions/upload-artifact@v4
        with:
          name: ep3-ci-metrics
          path: artifacts/ci-metrics.prom
      - name: Pruebas de integración de eventos y sintaxis
        run: |
          python3 -B -m unittest discover -s tests/ep3 -v
          for script in scripts/ep3/*.sh; do bash -n "$script"; done
          python3 -m json.tool cloud/infra.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep3-unit-tests
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**
      - name: Empaquetar JAR verificados del commit
        run: bash scripts/ep3/verified-jars.sh prepare "$RUNNER_TEMP/verified-jars"
      - uses: actions/upload-artifact@v4
        with:
          name: ep3-verified-jars
          path: ${{ runner.temp }}/verified-jars/
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
  swarm:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      IMAGE_PREFIX: edubio360
      EP3_MONITORING: 'true'
      EP3_FRONTEND: 'true'
      GRAFANA_ADMIN_PASSWORD: ephemeral-ci-grafana-only
      GRAFANA_ROOT_URL: http://grafana:3000/
      IMAGE_TAG: ${{ github.sha }}
      MYSQL_ROOT_PASSWORD: ephemeral-ci-mysql-ep3
      RABBITMQ_PASSWORD: ephemeral-ci-rabbit-ep3
      JWT_SECRET: ephemeral-ci-jwt-long-key-ep3-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ep3-ci-metrics
          path: artifacts
      - uses: actions/checkout@v4
        with:
          repository: Nicricht/edubio360-frontend
          ref: 1cb471aaa416a3cf346a40c536506fdbf7dc605a
          path: frontend-source
      - uses: actions/download-artifact@v4
        with:
          name: ep3-verified-jars
          path: ${{ runner.temp }}/verified-jars
      - name: Verificar integridad y commit de JAR
        run: bash scripts/ep3/verified-jars.sh verify "$RUNNER_TEMP/verified-jars"
      - name: Preparar Chromium reproducible
        timeout-minutes: 18
        run: |
          set -euo pipefail
          base=mcr.microsoft.com/playwright/python:v1.56.0-noble
          for attempt in 1 2 3; do
            if timeout 240s docker pull "$base"; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep "$((attempt * 10))"
          done
          docker build --pull=false -t edubio360-browser:1.56.0 - <<'DOCKERFILE'
          FROM mcr.microsoft.com/playwright/python:v1.56.0-noble
          RUN python -m pip install --no-cache-dir --retries 5 --timeout 30 playwright==1.56.0
          DOCKERFILE
          docker run --rm --init --ipc=host --user "$(id -u):$(id -g)" -e HOME=/tmp edubio360-browser:1.56.0 python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); page=b.new_page(); page.goto("data:text/html,<title>ready</title>"); assert page.title()=="ready"; b.close(); p.stop()'
      - name: Construir todas las imágenes
        run: |
          PRECOMPILED_CONTEXT="$RUNNER_TEMP/verified-jars" bash scripts/ep3/build-images.sh
          docker build -t "$IMAGE_PREFIX/frontend:$IMAGE_TAG" frontend-source
      - name: Inicializar y desplegar Swarm
        timeout-minutes: 6
        run: |
          set -o pipefail
          mkdir -p artifacts
          bash scripts/ep3/swarm-init.sh manager "$(hostname -I | awk '{print $1}')"
          docker stack config -c docker-stack.yml >/dev/null
          echo "DEPLOY_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          bash scripts/ep3/swarm-deploy.sh
      - name: Salud y escalamiento de servicios
        timeout-minutes: 30
        run: |
          set -o pipefail
          bash scripts/ep3/swarm-smoke.sh | tee artifacts/swarm.txt
          echo "DEPLOY_DURATION_SECONDS=$(($(date +%s)-DEPLOY_STARTED))" >> "$GITHUB_ENV"
      - name: Flujo de negocio y autorización
        timeout-minutes: 6
        run: |
          set -o pipefail
          bash scripts/ep3/flow.sh | tee artifacts/flow.txt
      - name: Observabilidad completa
        timeout-minutes: 18
        run: |
          set -o pipefail
          bash scripts/ep3/monitoring-smoke.sh | tee artifacts/monitoring.txt
          bash scripts/ep3/publish-ci-metrics.sh
          python3 scripts/ep3/observability-report.py > artifacts/observability-summary.json
      - name: Capturas reales de Grafana
        timeout-minutes: 8
        run: |
          docker run --rm --init --network edubio_backend --ipc=host \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e GRAFANA_ADMIN_PASSWORD \
            -e GRAFANA_URL=http://grafana:3000 \
            -v "$PWD/scripts/ep3/grafana-browser.py:/work/grafana-browser.py:ro" \
            -v "$PWD/artifacts:/work/artifacts" -w /work \
            edubio360-browser:1.56.0 python /work/grafana-browser.py
      - name: Exportar Swagger y Excel de endpoints
        timeout-minutes: 3
        run: |
          python3 -m pip install openpyxl==3.1.5
          python3 scripts/ep3/export-api-contracts.py --base http://127.0.0.1:8080
      - name: Prueba Fullstack con Chromium
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p artifacts
          export FRONTEND_URL=http://127.0.0.1:8088
          docker run --rm --init --network host --ipc=host \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e FRONTEND_URL \
            -v "$PWD/scripts/ep3/browser-smoke.py:/work/browser-smoke.py:ro" \
            -v "$PWD/artifacts:/work/artifacts" -w /work \
            edubio360-browser:1.56.0 python /work/browser-smoke.py
      - name: Guardar diagnóstico
        if: always()
        run: |
          mkdir -p artifacts
          docker stack services edubio > artifacts/services.txt 2>&1 || true
          for s in $(docker stack services edubio --format '{{.Name}}' 2>/dev/null); do
            docker service ps --no-trunc "$s" >> artifacts/swarm-tasks.txt 2>&1 || true
            timeout 20s docker service logs --tail 80 "$s" >> artifacts/swarm-logs.txt 2>&1 || true
          done
          docker stack rm edubio || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep3-swarm
          path: artifacts/
  cloud:
    needs: [verify, swarm]
    if: >-
      github.ref == 'refs/heads/ep3-devops-cloud' &&
      vars.EP3_AWS_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy_isolated_aws == true) ||
       (github.event_name == 'push' && vars.EP3_DEVOPS_AUTO_DEPLOY == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    environment: ep3-aws
    concurrency:
      group: edubio-devops-ep3-aws
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.EP3_AWS_REGION }}
      EP3_AWS_AUTH_MODE: ${{ vars.EP3_AWS_AUTH_MODE }}
      EP3_EXPECTED_AWS_ACCOUNT: ${{ vars.EP3_AWS_ACCOUNT_ID }}
      IMAGE_TAG: ${{ github.sha }}
      EP3_STACK: edubio-devops-ep3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: ep3-ci-metrics
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: ep3-verified-jars
          path: ${{ runner.temp }}/verified-jars
      - name: Verificar integridad y commit de JAR
        run: bash scripts/ep3/verified-jars.sh verify "$RUNNER_TEMP/verified-jars"
      - name: Preparar Chromium reproducible
        timeout-minutes: 18
        run: |
          set -euo pipefail
          base=mcr.microsoft.com/playwright/python:v1.56.0-noble
          for attempt in 1 2 3; do
            if timeout 240s docker pull "$base"; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep "$((attempt * 10))"
          done
          docker build --pull=false -t edubio360-browser:1.56.0 - <<'DOCKERFILE'
          FROM mcr.microsoft.com/playwright/python:v1.56.0-noble
          RUN python -m pip install --no-cache-dir --retries 5 --timeout 30 playwright==1.56.0
          DOCKERFILE
          docker run --rm --init --ipc=host --user "$(id -u):$(id -g)" -e HOME=/tmp edubio360-browser:1.56.0 python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); page=b.new_page(); page.goto("data:text/html,<title>ready</title>"); assert page.title()=="ready"; b.close(); p.stop()'
      - uses: actions/checkout@v4
        with:
          repository: Nicricht/edubio360-frontend
          ref: 1cb471aaa416a3cf346a40c536506fdbf7dc605a
          path: frontend-source
      - name: Seguridad y calidad frontend antes de aprovisionar AWS
        working-directory: frontend-source
        run: |
          npm ci
          npm audit --audit-level=high
          npm run test:coverage
          npm run build
      - name: Bloqueo de seguridad antes de aprovisionar AWS
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          test -n "$SNYK_TOKEN"
          npm install --global snyk
          snyk test --maven-aggregate-project --severity-threshold=high --ignore-policy
          snyk code test --severity-threshold=high
      - uses: aws-actions/configure-aws-credentials@v4
        if: vars.EP3_AWS_AUTH_MODE != 'academy'
        with:
          role-to-assume: ${{ vars.EP3_AWS_ROLE_ARN }}
          aws-region: ${{ vars.EP3_AWS_REGION }}
      - name: Autenticación temporal AWS Academy
        if: vars.EP3_AWS_AUTH_MODE == 'academy'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.EP3_LAB_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.EP3_LAB_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.EP3_LAB_SESSION_TOKEN }}
          aws-region: ${{ vars.EP3_AWS_REGION }}
          allowed-account-ids: ${{ vars.EP3_AWS_ACCOUNT_ID }}
      - name: Verificar cuenta y roles académicos sin crear recursos
        if: vars.EP3_AWS_AUTH_MODE == 'academy'
        run: |
          set -euo pipefail
          test -n "$EP3_EXPECTED_AWS_ACCOUNT"
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EP3_EXPECTED_AWS_ACCOUNT"
          bash scripts/ep3/academy-preflight.sh
          role="$(aws iam get-role --role-name LabRole --query Role.Arn --output text)"
          profile="$(aws iam list-instance-profiles-for-role --role-name LabRole --query 'InstanceProfiles[?InstanceProfileName==`LabInstanceProfile`].InstanceProfileName | [0]' --output text)"
          test "$profile" = LabInstanceProfile
          printf 'EP3_ACADEMY=true\nEP3_LAB_ROLE_ARN=%s\nEP3_LAB_INSTANCE_PROFILE=%s\n' "$role" "$profile" >> "$GITHUB_ENV"
      - name: Comprobar aislamiento y autorización antes de crear recursos
        run: |
          test "$GITHUB_REF" = refs/heads/ep3-devops-cloud
          test "$EP3_STACK" = edubio-devops-ep3
          test -n "$EP3_EXPECTED_AWS_ACCOUNT"
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EP3_EXPECTED_AWS_ACCOUNT"
      - name: Provisionar VPC, EC2, ECR, SQS, Lambda, DynamoDB y API Gateway
        run: bash scripts/ep3/provision.sh
      - name: Construir y publicar imágenes en ECR
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          registry="$account.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          echo "IMAGE_PREFIX=$registry/edubio-devops-ep3" >> "$GITHUB_ENV"
          PRECOMPILED_CONTEXT="$RUNNER_TEMP/verified-jars" IMAGE_PREFIX="$registry/edubio-devops-ep3" PUSH_IMAGES=true bash scripts/ep3/build-images.sh
          docker build -t "$registry/edubio-devops-ep3/frontend:$IMAGE_TAG" frontend-source
          docker push "$registry/edubio-devops-ep3/frontend:$IMAGE_TAG"
      - name: Despliegue multi-nodo, escalamiento y prueba de extremo a extremo
        run: bash scripts/ep3/deploy-aws.sh
      - name: Prueba Fullstack en la URL HTTPS de AWS
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p artifacts
          export FRONTEND_URL="$(jq -er '.[] | select(.OutputKey=="ApiUrl") | .OutputValue' artifacts/cloud-outputs.json)"
          docker run --rm --init --network host --ipc=host \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e FRONTEND_URL \
            -v "$PWD/scripts/ep3/browser-smoke.py:/work/browser-smoke.py:ro" \
            -v "$PWD/artifacts:/work/artifacts" -w /work \
            edubio360-browser:1.56.0 python /work/browser-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep3-aws-evidence
          path: artifacts/
