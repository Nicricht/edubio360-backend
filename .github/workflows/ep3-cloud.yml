name: EduBio360 EP3 JVY0101
on:
  push:
    branches: [main, "feature/ep3-cloud", "feature/ep3-integral", "feature/ep3-jaxb-remediation"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ep3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pruebas Maven
        run: mvn -B -ntp clean verify
      - name: Diagnóstico JaCoCo
        if: always()
        run: python3 -B scripts/ep3/coverage-diagnostics.py
      - name: Exportar métricas reales de cobertura
        run: mkdir -p artifacts && python3 scripts/ep3/ci-metrics.py > artifacts/ci-metrics.prom
      - uses: actions/upload-artifact@v4
        with:
          name: ep3-ci-metrics
          path: artifacts/ci-metrics.prom
      - name: Pruebas de integración de eventos y sintaxis
        run: |
          python3 -B -m unittest discover -s tests/ep3 -v
          for script in scripts/ep3/*.sh; do bash -n "$script"; done
          python3 -m json.tool cloud/infra.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep3-unit-tests
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**
  swarm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE_PREFIX: edubio360
      EP3_MONITORING: 'true'
      EP3_FRONTEND: 'true'
      GRAFANA_ADMIN_PASSWORD: ephemeral-ci-grafana-only
      IMAGE_TAG: ${{ github.sha }}
      MYSQL_ROOT_PASSWORD: ephemeral-ci-mysql-ep3
      RABBITMQ_PASSWORD: ephemeral-ci-rabbit-ep3
      JWT_SECRET: ephemeral-ci-jwt-long-key-ep3-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ep3-ci-metrics
          path: artifacts
      - uses: actions/checkout@v4
        with:
          repository: Nicricht/edubio360-frontend
          ref: ac68fd6dac5ca8c43d49f8b7d868defe85a30821
          path: frontend-source
      - name: Construir todas las imágenes
        run: |
          bash scripts/ep3/build-images.sh
          docker build -t "$IMAGE_PREFIX/frontend:$IMAGE_TAG" frontend-source
      - name: Swarm y prueba integrada local
        run: |
          set -o pipefail
          mkdir -p artifacts
          bash scripts/ep3/swarm-init.sh manager "$(hostname -I | awk '{print $1}')"
          docker stack config -c docker-stack.yml >/dev/null
          started=$(date +%s)
          bash scripts/ep3/swarm-deploy.sh
          bash scripts/ep3/swarm-smoke.sh | tee artifacts/swarm.txt
          bash scripts/ep3/flow.sh | tee artifacts/flow.txt
          bash scripts/ep3/monitoring-smoke.sh | tee artifacts/monitoring.txt
          DEPLOY_DURATION_SECONDS=$(($(date +%s)-started)) bash scripts/ep3/publish-ci-metrics.sh
      - name: Prueba Fullstack con Chromium
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/ep3/browser-smoke.py
      - name: Guardar diagnóstico
        if: always()
        run: |
          mkdir -p artifacts
          docker stack services edubio > artifacts/services.txt 2>&1 || true
          for s in $(docker stack services edubio --format '{{.Name}}' 2>/dev/null); do
            docker service logs --tail 80 "$s" >> artifacts/swarm-logs.txt 2>&1 || true
          done
          docker stack rm edubio || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep3-swarm
          path: artifacts/
  cloud:
    needs: [verify, swarm]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && vars.EP3_AWS_ENABLED == 'true' && (vars.EP3_AWS_AUTH_MODE != 'academy' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    environment: ep3-aws
    env:
      AWS_REGION: ${{ vars.EP3_AWS_REGION }}
      EP3_AWS_AUTH_MODE: ${{ vars.EP3_AWS_AUTH_MODE }}
      EP3_EXPECTED_AWS_ACCOUNT: ${{ vars.EP3_AWS_ACCOUNT_ID }}
      IMAGE_TAG: ${{ github.sha }}
      EP3_STACK: edubio-ep3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: ep3-ci-metrics
          path: artifacts
      - name: Bloqueo de seguridad antes de aprovisionar AWS
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          test -n "$SNYK_TOKEN"
          npm install --global snyk
          snyk test --maven-aggregate-project --severity-threshold=high --ignore-policy
          snyk code test --severity-threshold=high
      - uses: aws-actions/configure-aws-credentials@v4
        if: vars.EP3_AWS_AUTH_MODE != 'academy'
        with:
          role-to-assume: ${{ vars.EP3_AWS_ROLE_ARN }}
          aws-region: ${{ vars.EP3_AWS_REGION }}
      - name: Autenticación temporal AWS Academy
        if: vars.EP3_AWS_AUTH_MODE == 'academy'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.EP3_LAB_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.EP3_LAB_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.EP3_LAB_SESSION_TOKEN }}
          aws-region: ${{ vars.EP3_AWS_REGION }}
          allowed-account-ids: ${{ vars.EP3_AWS_ACCOUNT_ID }}
      - name: Verificar cuenta y roles académicos sin crear recursos
        if: vars.EP3_AWS_AUTH_MODE == 'academy'
        run: |
          set -euo pipefail
          test -n "$EP3_EXPECTED_AWS_ACCOUNT"
          test "$(aws sts get-caller-identity --query Account --output text)" = "$EP3_EXPECTED_AWS_ACCOUNT"
          bash scripts/ep3/academy-preflight.sh
          role="$(aws iam get-role --role-name LabRole --query Role.Arn --output text)"
          profile="$(aws iam list-instance-profiles-for-role --role-name LabRole --query 'InstanceProfiles[?InstanceProfileName==`LabInstanceProfile`].InstanceProfileName | [0]' --output text)"
          test "$profile" = LabInstanceProfile
          printf 'EP3_ACADEMY=true\nEP3_LAB_ROLE_ARN=%s\nEP3_LAB_INSTANCE_PROFILE=%s\n' "$role" "$profile" >> "$GITHUB_ENV"
      - name: Provisionar VPC, EC2, ECR, SQS, Lambda, DynamoDB y API Gateway
        run: bash scripts/ep3/provision.sh
      - uses: actions/checkout@v4
        with:
          repository: Nicricht/edubio360-frontend
          ref: ac68fd6dac5ca8c43d49f8b7d868defe85a30821
          path: frontend-source
      - name: Construir y publicar imágenes en ECR
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          registry="$account.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          echo "IMAGE_PREFIX=$registry/edubio-ep3" >> "$GITHUB_ENV"
          IMAGE_PREFIX="$registry/edubio-ep3" PUSH_IMAGES=true bash scripts/ep3/build-images.sh
          docker build -t "$registry/edubio-ep3/frontend:$IMAGE_TAG" frontend-source
          docker push "$registry/edubio-ep3/frontend:$IMAGE_TAG"
      - name: Despliegue multi-nodo, escalamiento y prueba de extremo a extremo
        run: bash scripts/ep3/deploy-aws.sh
      - name: Prueba Fullstack en la URL HTTPS de AWS
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
          FRONTEND_URL="$(jq -er '.[] | select(.OutputKey=="ApiUrl") | .OutputValue' artifacts/cloud-outputs.json)" python3 scripts/ep3/browser-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep3-aws-evidence
          path: artifacts/
