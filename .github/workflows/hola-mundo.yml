name: Hola Mundo CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  saludo:
    name: Saludo de verificacion
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7

      - name: Saludar
        run: |
          echo "Hola Mundo desde GitHub Actions"
          echo "Repositorio: $GITHUB_REPOSITORY"
          echo "Rama: $GITHUB_REF_NAME"
          echo "Ejecutado por: $GITHUB_ACTOR"

      - name: Mostrar fecha
        run: date