{
  "version": "3.8",
  "services": {
    "discovery-server": {
      "environment": {
        "MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE": "health,info,prometheus",
        "MANAGEMENT_METRICS_TAGS_APPLICATION": "discovery-server",
        "MANAGEMENT_TRACING_SAMPLING_PROBABILITY": "1.0",
        "MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT": "http://tempo:4318/v1/traces"
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3",
          "tag": "{{.Name}}"
        }
      }
    },
    "auth-service": {
      "environment": {
        "MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE": "health,info,prometheus",
        "MANAGEMENT_METRICS_TAGS_APPLICATION": "auth-service",
        "MANAGEMENT_TRACING_SAMPLING_PROBABILITY": "1.0",
        "MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT": "http://tempo:4318/v1/traces"
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3",
          "tag": "{{.Name}}"
        }
      }
    },
    "academic-service": {
      "environment": {
        "MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE": "health,info,prometheus",
        "MANAGEMENT_METRICS_TAGS_APPLICATION": "academic-service",
        "MANAGEMENT_TRACING_SAMPLING_PROBABILITY": "1.0",
        "MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT": "http://tempo:4318/v1/traces"
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3",
          "tag": "{{.Name}}"
        }
      }
    },
    "guidance-service": {
      "environment": {
        "MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE": "health,info,prometheus",
        "MANAGEMENT_METRICS_TAGS_APPLICATION": "guidance-service",
        "MANAGEMENT_TRACING_SAMPLING_PROBABILITY": "1.0",
        "MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT": "http://tempo:4318/v1/traces"
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3",
          "tag": "{{.Name}}"
        }
      }
    },
    "notification-service": {
      "environment": {
        "MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE": "health,info,prometheus",
        "MANAGEMENT_METRICS_TAGS_APPLICATION": "notification-service",
        "MANAGEMENT_TRACING_SAMPLING_PROBABILITY": "1.0",
        "MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT": "http://tempo:4318/v1/traces"
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3",
          "tag": "{{.Name}}"
        }
      }
    },
    "analytics-service": {
      "environment": {
        "MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE": "health,info,prometheus",
        "MANAGEMENT_METRICS_TAGS_APPLICATION": "analytics-service",
        "MANAGEMENT_TRACING_SAMPLING_PROBABILITY": "1.0",
        "MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT": "http://tempo:4318/v1/traces"
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3",
          "tag": "{{.Name}}"
        }
      }
    },
    "import-service": {
      "environment": {
        "MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE": "health,info,prometheus",
        "MANAGEMENT_METRICS_TAGS_APPLICATION": "import-service",
        "MANAGEMENT_TRACING_SAMPLING_PROBABILITY": "1.0",
        "MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT": "http://tempo:4318/v1/traces"
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3",
          "tag": "{{.Name}}"
        }
      }
    },
    "api-gateway": {
      "environment": {
        "MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE": "health,info,prometheus",
        "MANAGEMENT_METRICS_TAGS_APPLICATION": "api-gateway",
        "MANAGEMENT_TRACING_SAMPLING_PROBABILITY": "1.0",
        "MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT": "http://tempo:4318/v1/traces"
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3",
          "tag": "{{.Name}}"
        }
      }
    },
    "prometheus": {
      "image": "prom/prometheus:v3.5.0",
      "configs": [
        {
          "source": "prometheus_config",
          "target": "/etc/prometheus/prometheus.yml"
        }
      ],
      "command": [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.retention.time=3d"
      ],
      "volumes": [
        "prometheus_data:/prometheus"
      ],
      "networks": [
        "backend"
      ],
      "deploy": {
        "replicas": 1,
        "placement": {
          "constraints": [
            "node.role == manager"
          ]
        },
        "resources": {
          "limits": {
            "memory": "512M"
          }
        },
        "restart_policy": {
          "condition": "any"
        }
      }
    },
    "grafana": {
      "image": "grafana/grafana:12.1.0",
      "environment": {
        "GF_SECURITY_ADMIN_PASSWORD": "${GRAFANA_ADMIN_PASSWORD}",
        "GF_USERS_ALLOW_SIGN_UP": "false",
        "GF_AUTH_ANONYMOUS_ENABLED": "false"
      },
      "configs": [
        {
          "source": "grafana_datasources",
          "target": "/etc/grafana/provisioning/datasources/edubio.yml"
        },
        {
          "source": "grafana_provider",
          "target": "/etc/grafana/provisioning/dashboards/edubio.yml"
        },
        {
          "source": "grafana_dashboard",
          "target": "/var/lib/grafana/dashboards/edubio.json"
        }
      ],
      "volumes": [
        "grafana_data:/var/lib/grafana"
      ],
      "networks": [
        "backend"
      ],
      "ports": [
        {
          "target": 3000,
          "published": 3000,
          "mode": "ingress"
        }
      ],
      "deploy": {
        "replicas": 1,
        "placement": {
          "constraints": [
            "node.role == manager"
          ]
        },
        "resources": {
          "limits": {
            "memory": "384M"
          }
        },
        "restart_policy": {
          "condition": "any"
        }
      }
    },
    "loki": {
      "image": "grafana/loki:3.5.5",
      "command": [
        "-config.file=/etc/loki/local-config.yaml"
      ],
      "volumes": [
        "loki_data:/loki"
      ],
      "networks": [
        "backend"
      ],
      "deploy": {
        "replicas": 1,
        "placement": {
          "constraints": [
            "node.role == manager"
          ]
        },
        "resources": {
          "limits": {
            "memory": "512M"
          }
        },
        "restart_policy": {
          "condition": "any"
        }
      }
    },
    "tempo": {
      "image": "grafana/tempo:2.8.2",
      "command": [
        "-config.file=/etc/tempo.yaml"
      ],
      "configs": [
        {
          "source": "tempo_config",
          "target": "/etc/tempo.yaml"
        }
      ],
      "user": "0",
      "volumes": [
        "tempo_data:/var/tempo"
      ],
      "networks": [
        "backend"
      ],
      "deploy": {
        "replicas": 1,
        "placement": {
          "constraints": [
            "node.role == manager"
          ]
        },
        "resources": {
          "limits": {
            "memory": "384M"
          }
        },
        "restart_policy": {
          "condition": "any"
        }
      }
    },
    "alloy": {
      "image": "grafana/alloy:v1.10.0",
      "command": [
        "run",
        "--storage.path=/var/lib/alloy",
        "/etc/alloy/config.alloy"
      ],
      "user": "0",
      "configs": [
        {
          "source": "alloy_config",
          "target": "/etc/alloy/config.alloy"
        }
      ],
      "volumes": [
        "/var/lib/docker/containers:/var/lib/docker/containers:ro",
        "alloy_data:/var/lib/alloy"
      ],
      "networks": [
        "backend"
      ],
      "deploy": {
        "mode": "global",
        "resources": {
          "limits": {
            "memory": "256M"
          }
        },
        "restart_policy": {
          "condition": "any"
        }
      }
    },
    "pushgateway": {
      "image": "prom/pushgateway:v1.11.1",
      "networks": [
        "backend"
      ],
      "deploy": {
        "replicas": 1,
        "placement": {
          "constraints": [
            "node.role == manager"
          ]
        },
        "resources": {
          "limits": {
            "memory": "128M"
          }
        },
        "restart_policy": {
          "condition": "any"
        }
      }
    },
    "cadvisor": {
      "image": "gcr.io/cadvisor/cadvisor:v0.52.1",
      "volumes": [
        "/:/rootfs:ro",
        "/var/run:/var/run:ro",
        "/sys:/sys:ro",
        "/var/lib/docker:/var/lib/docker:ro",
        "/dev/disk:/dev/disk:ro"
      ],
      "networks": [
        "backend"
      ],
      "deploy": {
        "mode": "global",
        "resources": {
          "limits": {
            "memory": "256M"
          }
        },
        "restart_policy": {
          "condition": "any"
        }
      }
    }
  },
  "configs": {
    "prometheus_config": {
      "file": "./observability/prometheus.yml"
    },
    "grafana_datasources": {
      "file": "./observability/datasources.yml"
    },
    "grafana_provider": {
      "file": "./observability/dashboards.yml"
    },
    "grafana_dashboard": {
      "file": "./observability/edubio.json"
    },
    "tempo_config": {
      "file": "./observability/tempo.yml"
    },
    "alloy_config": {
      "file": "./observability/alloy.alloy"
    }
  },
  "volumes": {
    "prometheus_data": {},
    "grafana_data": {},
    "loki_data": {},
    "tempo_data": {},
    "alloy_data": {}
  }
}
