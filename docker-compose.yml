x-java-resources: &java-resources
  limits:
    cpus: "1.0"
    memory: 1G
  reservations:
    cpus: "0.25"
    memory: 256M

services:
  mysql:
    image: mysql:8.0
    container_name: edubio-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" -Nse 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: edubio-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-edubio}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-edubio123}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  discovery-server:
    image: edubio360/discovery-server:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: discovery-server
        HEALTH_PORT: 8761
    container_name: edubio-discovery
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8761/actuator/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources: *java-resources

  auth-service:
    image: edubio360/auth-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: auth-service
        HEALTH_PORT: 8081
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: authdb
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-change-this-local-demo-secret-32-characters-minimum}
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources: *java-resources

  academic-service:
    image: edubio360/academic-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: academic-service
        HEALTH_PORT: 8082
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: academicdb
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/actuator/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources: *java-resources

  guidance-service:
    image: edubio360/guidance-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: guidance-service
        HEALTH_PORT: 8083
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: guidancedb
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_URL: http://discovery-server:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-edubio}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-edubio123}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      academic-service:
        condition: service_healthy
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/actuator/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources: *java-resources

  notification-service:
    image: edubio360/notification-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: notification-service
        HEALTH_PORT: 8084
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: notificationdb
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_URL: http://discovery-server:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-edubio}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-edubio123}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8084/actuator/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources: *java-resources

  analytics-service:
    image: edubio360/analytics-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: analytics-service
        HEALTH_PORT: 8085
    environment: &analytics-environment
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: analyticsdb
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8085/actuator/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources: *java-resources

  analytics-replica:
    profiles: [scale]
    image: edubio360/analytics-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: analytics-service
        HEALTH_PORT: 8085
    environment: *analytics-environment
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8085/actuator/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources: *java-resources

  import-service:
    image: edubio360/import-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: import-service
        HEALTH_PORT: 8086
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: importdb
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8086/actuator/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources: *java-resources

  api-gateway:
    image: edubio360/api-gateway:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: api-gateway
        HEALTH_PORT: 8080
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-change-this-local-demo-secret-32-characters-minimum}
    depends_on:
      discovery-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      guidance-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      import-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources: *java-resources

volumes:
  mysql_data:
