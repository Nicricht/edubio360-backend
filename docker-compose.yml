services:
  mysql:
    image: mysql:8.0
    container_name: edubio-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" -Nse 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: edubio-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-edubio}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-edubio123}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: discovery-server
    container_name: edubio-discovery
    ports:
      - "8761:8761"

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: auth-service
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: authdb
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-change-this-local-demo-secret-32-characters-minimum}
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    ports:
      - "8081:8081"

  academic-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: academic-service
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: academicdb
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    ports:
      - "8082:8082"

  guidance-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: guidance-service
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: guidancedb
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_URL: http://discovery-server:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-edubio}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-edubio123}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-server:
        condition: service_started
      academic-service:
        condition: service_started
    ports:
      - "8083:8083"

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: notification-service
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: notificationdb
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_URL: http://discovery-server:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-edubio}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-edubio123}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-server:
        condition: service_started
    ports:
      - "8084:8084"

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: analytics-service
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: analyticsdb
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    ports:
      - "8085:8085"

  import-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: import-service
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: importdb
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started
    ports:
      - "8086:8086"

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: api-gateway
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-change-this-local-demo-secret-32-characters-minimum}
    depends_on:
      - discovery-server
      - auth-service
      - academic-service
      - guidance-service
      - notification-service
      - analytics-service
      - import-service
    ports:
      - "8080:8080"

volumes:
  mysql_data:
