{
  "version": "3.8",
  "services": {
    "guidance-service": {
      "environment": {
        "EP3_CLOUD_EVENTS": "true"
      }
    },
    "cloud-event-bridge": {
      "image": "${IMAGE_PREFIX}/cloud-event-bridge:${IMAGE_TAG}",
      "environment": {
        "AWS_DEFAULT_REGION": "${AWS_REGION}",
        "SQS_QUEUE_URL": "${SQS_QUEUE_URL}",
        "RABBITMQ_HOST": "rabbitmq",
        "RABBITMQ_USER": "edubio",
        "RABBITMQ_PASSWORD": "${RABBITMQ_PASSWORD}"
      },
      "networks": [
        "backend"
      ],
      "deploy": {
        "replicas": 1,
        "restart_policy": {
          "condition": "any",
          "delay": "10s"
        },
        "resources": {
          "limits": {
            "memory": "256M"
          }
        }
      }
    },
    "analytics-service": {
      "deploy": {
        "placement": {
          "max_replicas_per_node": 1
        }
      }
    },
    "academic-service": {
      "deploy": {
        "placement": {
          "max_replicas_per_node": 1
        }
      }
    }
  }
}
